[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "meeting-workbench"
version = "0.1.0"
description = "Local-first meeting recording library and editing workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136,<0.137",
  "uvicorn[standard]>=0.48,<0.49",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.12,<3",
  "python-multipart>=0.0.22,<0.1",
  "numpy>=2.4,<3",
  "pypinyin>=0.55,<0.56",
]

[project.optional-dependencies]
semantic = [
  "sentence-transformers>=5.2,<6",
]
test = [
  "httpx>=0.28,<0.29",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.15,<0.16",
]

[project.scripts]
meeting-workbench = "meeting_workbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/meeting_workbench"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
# 只装了 httpx、没装 httpx2 时，starlette 的 TestClient 一导入就发一条弃用告警（告警原话是「install httpx2 instead」）。
# 要它消失只能装 httpx2，按规矩不装新依赖，所以只按「类别 + 消息」过滤这一条：同一个类别下别的告警（比如给
# TestClient 传 timeout）、别的弃用告警都照常报。以后装上 httpx2（把上面 test 依赖里的 httpx 换成它），这条告警
# 就不会再出现，把下面这行和 backend/tests/test_pytest_warning_filter.py 一起删掉。
filterwarnings = [
  "ignore:Using `httpx` with `starlette\\.testclient` is deprecated; install `httpx2` instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# 默认规则（E4、E7、E9、F）之外再开的：
# - RUF100：写了 noqa 却不起作用（规则没开，或那一行本来就不报）也算错，免得注释和规则对不上。
# 宽 except（BLE001）不开：它对写了 logger.exception / exc_info 的放行，对只记类型名和位置的
# describe_error 写法报错，开了等于逼着往日志里打整段 traceback（AI 相关的循环特意不这样记）；
# 这里的宽 except 都是有意的（后台循环、旁路失败只记账），挨个加 noqa 只是把旁边的注释再说一遍。
extend-select = ["RUF100"]
